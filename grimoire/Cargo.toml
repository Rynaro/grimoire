[package]
name = "grimoire"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
crossterm = "0.27"
dirs = "5.0"
once_cell = "1.19"
pulldown-cmark = "0.10"
ratatui = { version = "0.26", default-features = false, features = ["crossterm"] }
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
thiserror = "1.0"
unicode-width = "0.1"
walkdir = "2.5"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
