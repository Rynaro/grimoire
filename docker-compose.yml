version: '3.8'

services:
  grimoire:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: grimoire
    stdin_open: true
    tty: true
    volumes:
      - grimoire-notes:/root/.grimoire/notes
    environment:
      - TERM=xterm-256color
    # For development, you can mount the source code
    # volumes:
    #   - ./src:/app/src
    #   - ./Cargo.toml:/app/Cargo.toml
    #   - grimoire-notes:/root/.grimoire/notes

volumes:
  grimoire-notes:
    driver: local
