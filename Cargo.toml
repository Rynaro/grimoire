[package]
name = "grimoire"
version = "0.1.0"
edition = "2021"
authors = ["Grimoire Team"]
description = "A beautiful terminal-based notes application"
license = "MIT"

[dependencies]
ratatui = "0.26"
crossterm = "0.28"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.4"
syntect = "5.1"
pulldown-cmark = "0.9"
regex = "1.10"
chrono = "0.4"
anyhow = "1.0"
thiserror = "1.0"

[dev-dependencies]
