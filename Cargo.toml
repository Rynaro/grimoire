[package]
name = "grimoire"
version = "0.1.0"
edition = "2021"
authors = ["Grimoire Team"]
description = "A beautiful terminal-based notes application"
license = "MIT"

[dependencies]
ratatui = "0.27"
crossterm = "0.28"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
pulldown-cmark = "0.9"
syntect = "5.1"
walkdir = "2.4"
regex = "1.10"
notify = "6.1"
anyhow = "1.0"
dirs = "5.0"
chrono = "0.4"
